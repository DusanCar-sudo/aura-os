# Right-click (aura-rclick, aura-desk-catch).
#
# The bare desktop: your own apps first (pinned in right-click > Edit this
# menu, or ~/.config/aura/rightclick.list), then the Aura tools, whatever
# text is selected, and the desktop's own settings. aura-desk-catch is an
# invisible layer under the windows that hears those clicks.
#
# A window's border, or its title in the top bar: what you can do to that
# window (minimize, float, fullscreen, move to a desk or screen, terminal
# and files in its folder, close).
#
# Right-click inside a window still belongs to that app.
exec_always $HOME/.local/bin/aura-desk-catch --replace
bindsym --border button3 focus, exec $HOME/.local/bin/aura-rclick window

# Opened centred on the cursor; aura-rclick then moves itself beside it.
for_window [app_id="^aura-rclick$"] floating enable, sticky enable, border none, move position cursor
for_window [app_id="^aura-rclick-(edit|ask)$"] floating enable, move position center
