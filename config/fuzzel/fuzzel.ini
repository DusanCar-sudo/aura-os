# fuzzel — Aura OS launcher (Super+D), herdr theme: text only, square.
[main]
font=JetBrainsMono Nerd Font:size=12
prompt="> "
icons-enabled=no
dpi-aware=no
terminal=aura-term -e
width=60
lines=15
horizontal-pad=14
vertical-pad=10
inner-pad=6
line-height=22

[colors]
background=0e0e14f2
text=c8cad8ff
prompt=5c5f77ff
input=e6e8f2ff
placeholder=5c5f77ff
match=8b7cf6ff
selection=2a2a3aff
selection-text=e6e8f2ff
selection-match=a594f9ff
counter=5c5f77ff
border=8b7cf6ff

[border]
width=1
radius=0
