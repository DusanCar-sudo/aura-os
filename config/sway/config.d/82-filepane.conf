# File pane (task 009 part 4): aura-os-files pane mode in its own
# aura-term on the right edge. Hidden it lives in the scratchpad;
# aura-filepane-toggle floats it at 22% width of the focused output.
# Tiling rules for it are deliberately absent — it is always floating.
# Super+F is fullscreen; G is the nearest free key.
bindsym $mod+G exec aura-os-filepane-toggle
