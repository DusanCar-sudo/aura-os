# Everything opens on the built-in (default) display; the user sends a
# window to the external one with Super+/ (and back again). Without
# this, sway gives workspace 1 to whichever output sits at the top-left
# of the layout, often the external monitor. First name that exists wins.
workspace 1 output eDP-1 eDP-2 LVDS-1 HDMI-A-1 DP-1
workspace 2 output eDP-1 eDP-2 LVDS-1 HDMI-A-1 DP-1
workspace 3 output eDP-1 eDP-2 LVDS-1 HDMI-A-1 DP-1
workspace 4 output eDP-1 eDP-2 LVDS-1 HDMI-A-1 DP-1
workspace 5 output eDP-1 eDP-2 LVDS-1 HDMI-A-1 DP-1
workspace 6 output eDP-1 eDP-2 LVDS-1 HDMI-A-1 DP-1
workspace 7 output eDP-1 eDP-2 LVDS-1 HDMI-A-1 DP-1
workspace 8 output eDP-1 eDP-2 LVDS-1 HDMI-A-1 DP-1
workspace 9 output eDP-1 eDP-2 LVDS-1 HDMI-A-1 DP-1

# Super+/ : kick the focused window to the other display (focus follows)
bindsym $mod+slash move container to output next, focus output next
