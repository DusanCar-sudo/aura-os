# Aura OS — idle/lock policy (bin/aura-os-idle sets the AC/lid side).
# Screen off after 60m idle, lock before any sleep. Event-driven
# (swayidle blocks on the compositor's idle notify, no polling).
exec pgrep -x swayidle >/dev/null || swayidle -w \
    timeout 3600 'swaymsg "output * dpms off"' \
    resume 'swaymsg "output * dpms on"' \
    before-sleep 'aura-os-lock'
