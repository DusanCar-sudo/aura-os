# Dusan's apps (install/09-dusan-apps): voice mic + cockpit + powerboard.
# dic toggle: press once to record, again to transcribe, type, Enter.
# ydotoold (user service) does the typing into the focused window.
bindsym $mod+Space exec dic toggle

# the cockpit, and the power TUI in a terminal
bindsym $mod+Shift+P exec aura-pulse
bindsym $mod+Shift+O exec $term powerboard
