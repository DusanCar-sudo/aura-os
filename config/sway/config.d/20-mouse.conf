# Mouse: flat tracking, side buttons = volume (task 003).
#
# Flat = raw 1:1 pixels. The default adaptive profile eases fast moves,
# so the cursor glides past where the hand stopped — fluffy, not snappy.
# If flat ever feels too fast on a high-DPI mouse, add pointer_accel
# (e.g. 0.7) here — that scales, it does not ease.
input type:pointer {
    accel_profile flat
}

# Side buttons (back/forward on the Xiaomi Wireless Mouse 3): volume
# down/up on the default sink. --whole-window so they work over any
# window, not just borders. wpctl caps at 100%: no boost distortion.
bindsym --whole-window button8 exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindsym --whole-window button9 exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
