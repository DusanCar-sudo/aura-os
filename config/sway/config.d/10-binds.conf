# Aura OS — key bindings (task 003: tiling desktop).
# Super+Return terminal · Super+D launcher · Super+A Aura prompt.
# sway parses this file line by line — no multi-line commands here.
# Anything smart (tab pick, rename, color) lives in bin/aura-os-*.

bindsym $mod+Return exec $term
bindsym $mod+D exec $menu
bindsym $mod+A exec aura-os-prompt
bindsym $mod+comma exec aura-os-settings
bindsym $mod+Escape exec aura-os-power
bindsym $mod+Shift+P exec aura-os-profile cycle
bindsym $mod+Shift+L exec aura-os-lock
# screens: side by side / up-down, resolution, scale, on/off
# lowercase p: bindsym matches keysyms — capital P would need Shift too
# displays: aura-optanomai (rust/apps); the old TUI stays as aura-os-display
bindsym $mod+p exec $HOME/.local/bin/aura-optanomai

# screenshots (aura-os-shot): Print = screen, Shift+Print = region,
# Ctrl+Print = focused window. Print keysym is lowercase: Print, not P.
bindsym Print exec aura-os-shot full
bindsym Shift+Print exec aura-os-shot region
bindsym Ctrl+Print exec aura-os-shot window
# flameshot: region capture with an annotation editor (arrows, text,
# blur) before it saves/copies — aura-os-shot has no editor.
bindsym $mod+Shift+S exec flameshot gui

# brightness: F5 down, F6 up — plus the XF86 media codes the top-row
# keys send when FnLock is off, so both key paths hit the same slider.
bindsym F5 exec aura-os-brightness down
bindsym F6 exec aura-os-brightness up
bindsym XF86MonBrightnessDown exec aura-os-brightness down
bindsym XF86MonBrightnessUp exec aura-os-brightness up

# windows
bindsym $mod+Q kill
bindsym $mod+V floating toggle
# pop one window out of the tiles / back in: Super + middle-click on it
bindsym --whole-window $mod+button2 floating toggle
# whole desk: tiles <-> free overlapping windows
bindsym $mod+Shift+V exec aura-os-desk toggle
bindsym $mod+F fullscreen toggle
bindsym $mod+M exit
bindsym $mod+Shift+M reload

# focus (Super+arrows)
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

# move pane (Super+Shift+arrows)
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down

# split direction: the next window opens left/right/up/down of the
# focused one (Super+Alt+arrows). sway's tree only appends children,
# so left/up are done by bin/aura-os-split (event-driven move).
bindsym $mod+Alt+Left exec aura-os-split left
bindsym $mod+Alt+Right exec aura-os-split right
bindsym $mod+Alt+Up exec aura-os-split up
bindsym $mod+Alt+Down exec aura-os-split down

# resize (Super+Ctrl+arrows; sway repeats held keys by default)
bindsym $mod+Ctrl+Left resize shrink width 20px
bindsym $mod+Ctrl+Right resize grow width 20px
bindsym $mod+Ctrl+Up resize shrink height 20px
bindsym $mod+Ctrl+Down resize grow height 20px

# tabs inside a pane: Super+T toggles tabbed/split
bindsym $mod+T layout toggle tabbed
# flip the focused group: side by side <-> stacked (horizontal <-> vertical)
bindsym $mod+E layout toggle split

# workspaces / tabs 1-9
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
# move the window to desk N and go with it
bindsym $mod+Ctrl+1 move container to workspace number 1, workspace number 1
bindsym $mod+Ctrl+2 move container to workspace number 2, workspace number 2
bindsym $mod+Ctrl+3 move container to workspace number 3, workspace number 3
bindsym $mod+Ctrl+4 move container to workspace number 4, workspace number 4
bindsym $mod+Ctrl+5 move container to workspace number 5, workspace number 5
bindsym $mod+Ctrl+6 move container to workspace number 6, workspace number 6
bindsym $mod+Ctrl+7 move container to workspace number 7, workspace number 7
bindsym $mod+Ctrl+8 move container to workspace number 8, workspace number 8
bindsym $mod+Ctrl+9 move container to workspace number 9, workspace number 9

# new / close / rename / color live in aura-os-tab (voice can call
# them too: "aura, rename tab 2 to api and make it green")
bindsym $mod+N exec aura-os-tab new
bindsym $mod+W exec aura-os-tab close
bindsym $mod+Shift+R exec aura-os-tab rename
bindsym $mod+Shift+C exec aura-os-tab color-pick

# sidebar
bindsym $mod+B exec aura-os-tab sidebar toggle
# desktop file tree: a pane on the right edge, slides in and out
bindsym $mod+period exec $HOME/.local/bin/aura-tree-toggle
for_window [app_id="aura-tree"] floating enable, sticky enable, border pixel 1
# minimize the focused window into the sidebar (click it there to bring it back)
bindsym $mod+z exec $HOME/.local/bin/aura-os-minimize
# bars gone (crashed, not just hidden)? Super+Shift+B brings them back
bindsym $mod+Shift+B exec sh -c 'pkill -x waybar; pgrep -f "^bash /usr/local/bin/aura-os-bar$" >/dev/null || aura-os-bar'

# Resize without aiming at a 1px border:
#   Super + right-drag anywhere in a window (floating_modifier, see config)
#   Super+R → resize mode: arrows/hjkl in 40px steps, Shift = 10px,
#   Esc/Enter/Super+R leaves. The top bar shows "resize" while active.
mode "resize" {
    bindsym Left  resize shrink width 40px
    bindsym Right resize grow width 40px
    bindsym Up    resize shrink height 40px
    bindsym Down  resize grow height 40px
    bindsym h     resize shrink width 40px
    bindsym l     resize grow width 40px
    bindsym k     resize shrink height 40px
    bindsym j     resize grow height 40px
    bindsym Shift+Left  resize shrink width 10px
    bindsym Shift+Right resize grow width 10px
    bindsym Shift+Up    resize shrink height 10px
    bindsym Shift+Down  resize grow height 10px
    bindsym Escape mode "default"
    bindsym Return mode "default"
    bindsym $mod+R mode "default"
}
bindsym $mod+R mode "resize"

# Super+0: all windows in the focused group equal again
bindsym $mod+0 exec aura-os-balance

# application switcher: hold Alt and tap Tab to cycle through windows.
# Each Tab press advances one step in the MRU list with a notification.
# Escape cancels (restores original window), Return/any key confirms.
mode "switch" {
    bindsym Tab exec aura-os-switch cycle
    bindsym Shift+Tab exec aura-os-switch cancel; mode "default"
    bindsym Escape exec aura-os-switch cancel; mode "default"
    bindsym Return exec aura-os-switch confirm; mode "default"
    bindsym --release Mod1 exec aura-os-switch confirm; mode "default"
}
bindsym Mod1+Tab exec aura-os-switch cycle; mode "switch"
bindsym Mod1+Shift+Tab exec aura-os-switch last

# Alt+X: toggle dictation (press to start, press again to stop) — whisper.cpp
# transcribes and types the result into the focused window + clipboard.
# dictation: same engine as Ubuntu (aura-dic); local whisper stays as aura-mic
bindsym Mod1+x exec $HOME/.local/bin/aura-dic
