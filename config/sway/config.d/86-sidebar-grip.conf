# Drag the sidebar's right edge to resize it (aura-sidebar-grip): a thin
# invisible strip where the sidebar ends. Drag it almost shut to hide the
# sidebar; drag from the screen's edge to bring it back. The width is kept
# in ~/.config/aura/sidebar.json. exec_always + --replace: a config reload
# restarts it on a rebuilt binary.
exec_always $HOME/.local/bin/aura-sidebar-grip --replace
