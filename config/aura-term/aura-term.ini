# aura-term — herdr theme (themes/herdr/palette). Deployed to
# ~/.config/aura-term/aura-term.ini by install/05-aura-term.sh.
# Only what differs from the defaults in /usr/local/etc/xdg/aura-term.

[main]
font=JetBrainsMono Nerd Font:size=11
pad=6x4

[cursor]
style=beam
blink=no

[colors-dark]
background=0e0e14
foreground=c8cad8
selection-background=2a2a3a
selection-foreground=c8cad8
# regular / bright: dim-to-bright versions of the tab palette
regular0=14141e
regular1=f38ba8
regular2=83e6a0
regular3=f9e2af
regular4=6ea8fe
regular5=8b7cf6
regular6=5de4c7
regular7=c8cad8
bright0=5c5f77
bright1=f38ba8
bright2=83e6a0
bright3=f9e2af
bright4=6ea8fe
bright5=a594f9
bright6=5de4c7
bright7=e6e8f2
