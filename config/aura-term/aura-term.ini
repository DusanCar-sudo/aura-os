# aura-term — purplerain theme (themes/purplerain/palette). Deployed to
# ~/.config/aura-term/aura-term.ini by install/05-aura-term.sh.
# Only what differs from the defaults in /usr/local/etc/xdg/aura-term.

[main]
include=~/.config/aura-term/theme.ini
font=JetBrainsMono Nerd Font:size=11
pad=6x4

[cursor]
style=beam
blink=no

# colors: ~/.config/aura-term/theme.ini, written by aura-os-theme
