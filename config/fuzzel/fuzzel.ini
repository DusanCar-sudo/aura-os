# fuzzel — Aura OS launcher (Super+D), Aura OS look: text only, square.
[main]
# Menus stay open when the mouse moves or clicks elsewhere; close with
# Esc, or by picking an entry. Wheel scrolls the list, click selects.
exit-on-keyboard-focus-loss=no
include=~/.config/fuzzel/theme.ini
include=~/.config/fuzzel/look.ini
font=JetBrainsMono Nerd Font:size=12
prompt="> "
icons-enabled=no
dpi-aware=no
terminal=aura-term -e
width=60
lines=10
horizontal-pad=14
vertical-pad=10
inner-pad=6
line-height=22

# colors: ~/.config/fuzzel/theme.ini, written by aura-os-theme
[border]
width=1
radius=0
