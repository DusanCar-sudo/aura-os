# Aura OS — the function row, as printed on the keys.
#
# A separate file from 10-binds.conf on purpose: this drops in without
# touching a file that tends to carry local edits. config.d loads in name
# order, so anything here wins over an earlier duplicate.
#
#   F1 mute     F2 quieter    F3 louder    F4 mic mute
#   F5 dimmer   F6 brighter   F7 screens   F8 flight mode
#   F9 settings F10 lock
#
# F11 and F12 are left free on purpose — nothing here needs them, and a
# key that does nothing is better than one that does something surprising.
#
# Each key is bound twice: the bare F-key, and the XF86 media code the
# same physical key sends when FnLock is off. Both paths reach the same
# tool, so the row behaves the same either way — this is the pattern
# 10-binds.conf already set for brightness.
#
# --locked on sound and brightness: those must keep working on the lock
# screen. Nothing else should.

bindsym --locked F1 exec aura-os-audio mute
bindsym --locked F2 exec aura-os-audio down
bindsym --locked F3 exec aura-os-audio up
bindsym --locked F4 exec aura-os-audio mic-mute
bindsym F7  exec aura-os-display
bindsym F8  exec aura-os-airplane
bindsym F9  exec aura-os-settings
bindsym F10 exec aura-os-lock

bindsym --locked XF86AudioMute        exec aura-os-audio mute
bindsym --locked XF86AudioLowerVolume exec aura-os-audio down
bindsym --locked XF86AudioRaiseVolume exec aura-os-audio up
bindsym --locked XF86AudioMicMute     exec aura-os-audio mic-mute
bindsym XF86Display exec aura-os-display
bindsym XF86RFKill  exec aura-os-airplane
bindsym XF86Tools   exec aura-os-settings
