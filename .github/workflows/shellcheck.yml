name: shellcheck
on:
  push:
    paths: ['**/*.sh', 'bin/aura-*', '.github/workflows/shellcheck.yml']
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck bash/sh scripts (errors only)
        run: |
          set +e
          fail=0
          files=$(
            { find install tools vm -name '*.sh'; echo install.sh
              find bin -maxdepth 1 -type f -name 'aura-*'
            } | while read -r f; do
              head -1 "$f" | grep -qE '^#!.*(bash|sh)$' && echo "$f"
            done
          )
          for f in $files; do
            out=$(shellcheck -S error "$f" 2>&1) || { echo "=== $f"; echo "$out"; fail=1; }
          done
          exit $fail
