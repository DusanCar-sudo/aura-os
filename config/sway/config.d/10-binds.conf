# Aura OS — key bindings (task 003: herdr-style layout).
# Super+Return terminal · Super+D launcher · Super+A Aura prompt.
# sway parses this file line by line — no multi-line commands here.
# Anything smart (tab pick, rename, color) lives in bin/aura-os-*.

bindsym $mod+Return exec $term
bindsym $mod+D exec $menu
bindsym $mod+A exec aura-os-prompt
bindsym $mod+comma exec aura-os-settings

# windows
bindsym $mod+Q kill
bindsym $mod+V floating toggle
bindsym $mod+F fullscreen toggle
bindsym $mod+M exit
bindsym $mod+Shift+M reload

# focus (Super+arrows)
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

# move pane (Super+Shift+arrows)
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down

# split direction: the next window opens left/right/up/down of the
# focused one (Super+Alt+arrows). sway's tree only appends children,
# so left/up are done by bin/aura-os-split (event-driven move).
bindsym $mod+Alt+Left exec aura-os-split left
bindsym $mod+Alt+Right exec aura-os-split right
bindsym $mod+Alt+Up exec aura-os-split up
bindsym $mod+Alt+Down exec aura-os-split down

# resize (Super+Ctrl+arrows; sway repeats held keys by default)
bindsym $mod+Ctrl+Left resize shrink width 20px
bindsym $mod+Ctrl+Right resize grow width 20px
bindsym $mod+Ctrl+Up resize shrink height 20px
bindsym $mod+Ctrl+Down resize grow height 20px

# tabs inside a pane: Super+T toggles tabbed/split
bindsym $mod+T layout toggle tabbed
# flip the focused group: side by side <-> stacked (horizontal <-> vertical)
bindsym $mod+E layout toggle split

# workspaces / tabs 1-9
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9

# new / close / rename / color live in aura-os-tab (voice can call
# them too: "aura, rename tab 2 to api and make it green")
bindsym $mod+N exec aura-os-tab new
bindsym $mod+W exec aura-os-tab close
bindsym $mod+Shift+R exec aura-os-tab rename
bindsym $mod+Shift+C exec aura-os-tab color-pick

# sidebar
bindsym $mod+B exec aura-os-tab sidebar toggle
